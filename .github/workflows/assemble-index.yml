name: assemble-index
on:
  push:
    branches: [tidy/voice-product-2026-09-16]
    paths:
      - '_assemble/**'
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tidy/voice-product-2026-09-16
      - name: Assemble index.html from parts
        run: |
          python3 << 'PY'
          import base64, gzip, pathlib, glob
          parts = sorted(glob.glob('_assemble/index.part-*.b64'))
          assert parts, 'missing parts'
          b64 = ''.join(pathlib.Path(p).read_text().strip() for p in parts)
          data = gzip.decompress(base64.b64decode(b64))
          pathlib.Path('index.html').write_bytes(data)
          print('wrote index.html', len(data))
          PY
      - name: Commit restored index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo 'no change' && exit 0
          git commit -m "tidy: assemble restored index.html Voice/product polish"
          git push

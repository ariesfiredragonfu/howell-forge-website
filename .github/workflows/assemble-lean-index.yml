name: assemble-lean-index
on:
  workflow_dispatch:
  push:
    branches: ['staging/**', 'staging']
    paths:
      - '_lean_assemble/**'
      - '.github/workflows/assemble-lean-index.yml'
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble lean index.html from parts
        run: |
          python3 << 'PY'
          import base64, gzip, pathlib, glob, hashlib
          parts = sorted(glob.glob('_lean_assemble/index.part-*.b64'))
          assert parts, 'missing parts'
          print('parts', len(parts), parts)
          b64 = ''.join(pathlib.Path(p).read_text().strip() for p in parts)
          data = gzip.decompress(base64.b64decode(b64))
          pathlib.Path('index.html').write_bytes(data)
          print('wrote index.html', len(data), hashlib.sha256(data).hexdigest())
          assert data.startswith(b'<!DOCTYPE html>')
          assert b'</html>' in data[-20:]
          text = data.decode('utf-8')
          assert 'Voice-to-PCB' not in text
          assert 'Business AI Audit' not in text
          assert 'AiEcosystemShell' not in text
          assert 'GroundChiFlow' in text
          PY
      - name: Commit assembled index.html on the triggering branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index.html changes"
          else
            git commit -m "staging: assemble lean index.html (do not merge until Chris approves)"
            git push origin HEAD
          fi
